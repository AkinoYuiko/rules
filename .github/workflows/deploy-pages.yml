name: Deploy rules to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.lsr"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build rule files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          while IFS= read -r -d '' source; do
            relative="${source#./}"
            directory="$(dirname "$relative")"
            name="$(basename "$relative" .lsr)"

            if [[ "$name" == "boost" ]]; then
              name="Boost"
            fi

            destination="_site/$directory/$name"
            if [[ -e "$destination" ]]; then
              echo "Duplicate deployment path: $destination" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
          done < <(find . -path './_site' -prune -o -type f -name '*.lsr' -print0)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
